[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-notion"
version = "0.1.0"
description = "CLI-Anything Notion: Agent-native CLI for Notion with macOS desktop deep-linking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "notion-client>=2.2.1",
]

[project.scripts]
notion-cli = "cli_anything_notion.cli:main"
cli-anything-notion = "cli_anything_notion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

